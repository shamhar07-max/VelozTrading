name: Build Apps

on:
  push:
    branches: [main]
    paths:
      - "artifacts/veloztrade/**"
      - "artifacts/app-android/**"
      - "artifacts/app-windows/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @workspace/veloztrade run build
      - name: Build mobile app UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/mobile-app run build
      - name: Install Android wrapper deps
        working-directory: artifacts/app-android
        run: pnpm install --frozen-lockfile
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Add Android platform
        working-directory: artifacts/app-android
        run: npx cap add android
      - name: Apply brand icons & splash
        working-directory: artifacts/app-android
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/values
          cp resources/splash.png $R/drawable/splash.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            M=$R/mipmap-$d
            mkdir -p $M
            case $d in
              mdpi)    S=48;;  hdpi) S=72;;  xhdpi) S=96;;  xxhdpi) S=144;; xxxhdpi) S=192;;
            esac
            # Legacy square/round launchers (Android 7 and below)
            cp resources/mipmap-$d/ic_launcher.png $M/ic_launcher.png
            cp resources/mipmap-$d/ic_launcher_round.png $M/ic_launcher_round.png
            cp resources/mipmap-$d/ic_launcher_foreground.png $M/ic_launcher_foreground.png
          done
          # Adaptive icon background color (brand dark)
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#040C1A</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          # Force adaptive icons to use our foreground + background on Android 8+
          mkdir -p $R/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/ic_launcher.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sync
        working-directory: artifacts/app-android
        run: npx cap sync android
      - name: Build Debug APK
        working-directory: artifacts/app-android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VelozTrade-Android-APK
          path: artifacts/app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @workspace/veloztrade run build
      - name: Install Windows wrapper deps
        working-directory: artifacts/app-windows
        run: pnpm install
      - name: Build Windows installer
        working-directory: artifacts/app-windows
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: VelozTrade-Windows-Installer
          path: artifacts/app-windows/release/*
          if-no-files-found: warn
