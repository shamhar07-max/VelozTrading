services:
  - type: web
    name: veloztrade
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: veloztrade-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # optional market data
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: veloztrade-db
    plan: free
    databaseName: veloztrade
    user: veloz
    # Render auto-generates password and exposes DATABASE_URL
