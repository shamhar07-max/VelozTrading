# Railway configuration — https://docs.railway.app/reference/config-as-code
#
# Railway is the best single-platform fit for VelozTrade:
#   ✔ long-running Docker service (no sleep) → WebSocket + background jobs work
#   ✔ native WebSockets
#   ✔ usage-based pricing (hobby ≈ $5/mo covers a low-traffic deployment)
#
# Deploy: railway.app → New Project → Deploy from GitHub repo → select this repo
# → Settings → Networking → Generate Domain → add the env vars below.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Chain semantics:
#   1. migrate runs; its failure does NOT abort the chain (|| true) so the
#      rescue server can still report the cause over HTTP
#   2. main app starts
#   3. if the main app exits/crashes for ANY reason, the rescue diagnostic
#      server takes the port and answers every request with the failure class
startCommand = "sh -c \"(node --enable-source-maps artifacts/api-server/dist/migrate.mjs || true) && { node --enable-source-maps artifacts/api-server/dist/index.mjs || node --enable-source-maps artifacts/api-server/dist/rescue.mjs; }\""
# Health-check gating REMOVED by request: Railway now considers the deploy
# live as soon as the container starts instead of blocking on probe retries.
# The /api/healthz route stays available for manual/uptime monitoring —
# verify a deployment yourself with:
#   curl -s https://<domain>/api/healthz
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
