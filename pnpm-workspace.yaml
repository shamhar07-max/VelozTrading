packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - electron
  - esbuild
  - unrs-resolver

# Explicitly skip postinstall scripts pnpm would otherwise leave "pending"
# (pending builds are a fatal error in non-interactive Docker/CI installs).
ignoredBuiltDependencies:
  - '@clerk/shared'
  - bufferutil
  - keccak
  - msw
  - puppeteer
  - utf-8-validate

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  esbuild: 0.28.1
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  qs@>=6.11.1 <=6.15.1: '>=6.15.2'
  uuid@<11.1.1: '>=11.1.1'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
